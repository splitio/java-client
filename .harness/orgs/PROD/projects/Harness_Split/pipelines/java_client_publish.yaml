pipeline:
  name: java-client-publish
  identifier: java_client_publish
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  description: >-
    On-demand publish of java-client (all modules) to the Harness Maven registry (fme-mvn). Pick the branch to publish at run time.
    Versions are immutable: publishing a version that already exists fails, so bump the -rcN suffix first.
  properties:
    ci:
      codebase:
        repoName: java-client
        build: <+input>
        depth: 0
  stages:
    - stage:
        name: publish
        identifier: publish
        description: Build and deploy every module with the harness-maven profile
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              # jvm-commons submodule: CI pulls it from the Harness Code mirror
              - step:
                  type: Run
                  name: init submodules
                  identifier: init_submodules
                  spec:
                    connectorRef: dockerhub
                    image: maven:3.9-eclipse-temurin-17
                    shell: Bash
                    command: |-
                      git config submodule.jvm-commons.url https://git0.harness.io/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Split/jvm-commons.git
                      git submodule update --init --recursive
              - step:
                  type: Run
                  name: deploy to harness maven
                  identifier: deploy_to_harness_maven
                  spec:
                    connectorRef: dockerhub
                    image: maven:3.9-eclipse-temurin-17
                    shell: Bash
                    envVariables:
                      HARNESS_MAVEN_USERNAME: fme-mvn@service.harness.io
                      HARNESS_MAVEN_PASSWORD: <+secrets.getValue("fme-mvn-publish")>
                    command: |-
                      # The credentials are read from the environment by .ci.settings.xml. Nothing here echoes them.
                      mkdir -p ${HOME}/.m2 && cp .ci.settings.xml ${HOME}/.m2/settings.xml
                      mvn --batch-mode -f jvm-commons/pom.xml -pl events -am install -DskipTests
                      mvn --batch-mode -Pharness-maven clean deploy -DskipTests
